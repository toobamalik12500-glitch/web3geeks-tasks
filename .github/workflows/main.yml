name: Real Estate Voice Agent CI/CD
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: List Files
        run: |
          ls -R
          find . -name "*.py"
      - name: Install and Check
        run: |
          pip install fastapi uvicorn
          python -m compileall .
      - name: Build Docker Image
        run: docker build -t voice-agent .
      - name: Test Health Endpoint
        run: |
          docker run -d -p 8000:8000 voice-agent
          sleep 10
          curl --fail http://localhost:8000/health
