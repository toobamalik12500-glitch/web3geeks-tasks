name: Real Estate Voice Agent CI/CD
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./W4_Real_estate_agent_project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and Check
        run: |
          pip install -r requirements.txt
          python -m py_compile main.py
      - name: Build Docker Image
        run: docker build -t voice-agent .
      - name: Test Health Endpoint
        run: |
          docker run -d -p 8000:8000 --name test-agent voice-agent
          sleep 15
          curl --fail http://localhost:8000/health
